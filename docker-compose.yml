version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: lyzr_policy_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lyzr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lyzr_secret}
      POSTGRES_DB: ${POSTGRES_DB:-lyzr_policy}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: lyzr_policy_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@lyzr.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pgdata:
